    usage: "正在征集「{topic}」的意见。用法：/意见 你的想法"
    added: "收到 {member} 的意见～（现在 {people} 人提了 {count} 条）"
    too_long: "一条意见最多 {max} 个字哦，精简一下，或者分成几条"
    member_full: "每人最多提 {max} 条哦。想换一条的话，先 /意见 撤回"
    full: "这次已经收满 {max} 条意见啦，等管理员 /结束征集 吧"
