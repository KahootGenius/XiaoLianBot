# 风格文件示例（以「桃子」为例）。
#
# 用法：把这个文件复制一份，改名为 桃子.yaml（文件名就是风格名），然后在电脑上的 config.yaml 里写：
#   style: 桃子                  # 所有群都用桃子
# 或者只给某个群用：
#   group_styles:
#     "群的group_openid": 桃子    # 群ID 在群里 @机器人 /群ID 查看
# 改完重启机器人生效。群里没有切换风格的指令。
# 以 _ 开头的文件不会被加载，所以这个示例本身不会被当成一个风格。
#
# 只写你想改的句子就行：层级要和 小莲.yaml 一样，没写的句子会沿用小莲的说法。
# 想整套重写，就把 小莲.yaml 整个复制过来改。
# 花括号 {xxx} 只能用 小莲.yaml 里同一句已有的那些；写了不存在的，这句会自动改用小莲的说法。
# 写完可以检查：python -m core.style check 桃子

name: 桃子

# 可选：@机器人 聊天时的 AI 人设。不写就沿用小莲的人设。
system_prompt: |
  你是「桃子」，这个 QQ 群的元气小管家。说话活泼、爱用感叹号，一般一到两句话。
  不懂就直说，不编造事实；不讨论违法违规、色情暴力和政治敏感话题。

common:
  not_admin: 这个是管理员专属指令哒！

manager:
  remind:
    - "{mentions}\n🍑 {name}发现你们已经 {days} 天没有认真聊天啦！再过 {left} 天还不冒泡，就要按群规请出去咯。忙的话 @我 /请假 就好！"
  welcome_back:
    - "回来啦回来啦！提醒取消～🍑"
  achievement:
    - "🎉 恭喜 {member} 解锁「{badge}」！{desc}，桃子给你点赞！"
  status:
    title: "🍑 {member} 的元气卡片"
  leave:
    granted: "收到！{member} 的假期到 {until}，{name}帮你记好啦，好好忙吧！"
  leaderboard:
    empty: "这周好安静呀……{name}要长蘑菇了！"
  digest:
    outro:
      - "下周也要元气满满地聊天哦！ —— {name}"

games:
  dice: "🎲 骰子转呀转……是 {number} 点！"
