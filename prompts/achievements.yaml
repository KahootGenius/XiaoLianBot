# 小莲的成就。增删、修改成就只要改这个文件，不用动代码；改完重启机器人生效。
# 写错了（比如重复的 code、不存在的计数），机器人启动时会直接报出是第几个成就的问题。
# /成就 按这个文件里的顺序列出成就。
#
# 每个成就要写：
#   code      唯一编号，只用英文、数字、下划线。有人获得之后就不要再改它，
#             否则大家已有的这个成就会对不上（名称、说明、图标、门槛可以随时改）。
#   icon      图标，一个 emoji
#   name      名称
#   desc      说明：解锁时小莲会念出来，/成就 里也会显示
#   announce  解锁时是否在群里祝贺，可省略，默认 true
#   hidden    隐藏成就，可省略，默认 false。写 true 的话，解锁前 /成就 不显示它的名字，
#             只说「还有几个隐藏成就」
# 再加上下面四种条件中的一种（只能写一种）：
#   counter + at_least   某项计数达到多少，例如 counter: valid 和 at_least: 100
#   streak               连续多少天都有有效发言，例如 streak: 7
#   comeback: true       沉默 20 天以上后回来发言
#   dates                在这些日子里有效发言，例如 dates: ["01-01"]。"01-01" 是每年这一天；
#                        2027-02-06 这样带年份的只算那一天，农历节日每年日子不同，就把每年的都写上
#
# 可用的计数：
#   每条有效发言更新的（只算有效发言）：
#     valid     有效发言条数
#     question  提问条数
#     reply     带引用的回复条数
#     share     分享次数：链接、文件、带说明的图片或视频
#     night     凌晨 0–5 点的条数
#     morning   早上 5–8 点的条数
#     weekend   周六、周日的条数
#     long      50 个字以上的长发言条数
#     days      有有效发言的天数（同一天只算一次）
#     opener    当天群里第一条有效发言的次数（从早上 5 点算起，熬夜抢不到）
#   其他功能更新的：
#     birthday  用 /生日 登记的生日当天来群里说话（每年一次）
#     vote      参加过几次 /投票（改票不重复算）
#     opinion   在几次 /征集意见 里提过意见（每次征集只算一次，撤回也不会重复算）
#     sleep     /晚安 后睡了 7 到 9 小时再 /早安 的次数
#
# 新加的成就会在成员下一次有效发言时检查；条件早就满足的人会在那时解锁。
# 一个群每小时最多祝贺 3 次（config.yaml 里 manager 下的 achievements.max_per_hour），一下子加很多也不会刷屏；
# 没祝贺到的照样解锁，/成就 和每周小报里看得到。

