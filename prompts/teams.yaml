# 组队游戏（/抓）的规则：队员有哪些状态、队长能做哪些操作。
# 增删、修改都只要改这个文件，不用动代码；改完重启机器人生效。
# 写错了，机器人启动时会直接指出是哪一项。
#
# 玩法：
# - 队长名单在 config.yaml 的 teams.captains 里。队长 @我 /抓 @某人，把还没进队的人抓进自己的队伍，
#   一次可以 @ 好几个人。每人同一时间只能在一支队伍里。
# - 被抓的人自己不能退队，由队长决定：队长可以对自己队里的人使用下面 actions 里的操作。
# - 当天没带队的队长也可以被别人抓进队，当一名普通队员。
# - 管理员相当于裁判：可以对任何队伍的队员使用任何操作（抓人除外），还能 /解散队伍 @队长、/清空队伍。
# - 每天 reset_time 时，所有队伍自动清空。
#
# - 躲猫猫、突发事件和档案各有一段，在队长的操作前面。
#
# 内置指令（不能拿来当操作名）：/队伍 查看今天的队伍 · /解散队伍 · /清空队伍 · /躲 · /找 · /档案，
# 可以在下面的 commands 里改名

# 内置指令的名字，可省略（省略就用默认的名字）
#   teams    查看今天的队伍，所有人都能用
#   disband  队长放走自己队里的所有人；管理员加 @队长 解散别人的队伍
#   clear    管理员清空本群所有队伍，躲着的人也都出来
#   hide     还没进队的人躲起来（躲猫猫）
#   seek     队长去一个地方找躲起来的人
#   record   看自己的游戏档案，加 @某人 看别人的
commands:
  teams: 队伍
  disband: 解散队伍
  clear: 清空队伍
  hide: 躲
  seek: 找
  record: 档案

# 游戏自己的叫法，用在服务器日志和这个文件的出错提示里，可省略（省略就用下面这些）。
# 群里看到的说法在风格文件里改。
#   game     游戏的名字
#   captain  队长的叫法
#   team     队伍的叫法
names:
  game: 组队游戏
  captain: 队长
  team: 队伍

# 每队最多几人（不算队长），0 = 不限
max_members: 0

# 每天几点清空所有队伍（北京时间），写成带引号的 "05:00"
reset_time: "05:00"

# 队员的状态，分成几栏。每一栏同一时间只有一个状态；
# 第一个是刚被抓进队时的状态，在 /队伍 里不显示。
# 状态名在所有栏里都不能重复，因为下面的操作直接用名字指代它。
statuses:
  职位: [队员, 小队长]
  生死: [存活, 死亡]

# 状态在 /队伍 里的图标，显示在名字前面。没有图标的状态写在名字后面的括号里。
icons:
  小队长: ⭐
  死亡: 💀

# 和机器人 AI 聊天时，她知道今天的队伍和每个人的状态，好在聊天里接上游戏。
# 不想让 AI 知道的状态列在这里，可省略。例如：hide_from_ai: [死亡]
hide_from_ai: []

# ---------------------------------------------------------------- 躲猫猫
# 还没进队的人 @我 /躲 就躲起来了。躲在下面哪个地方由我来定，谁也不告诉，连本人也不知道
# （在群里发的指令大家都看得到，自己选就藏不住了）。躲起来的人 /抓 抓不到，队长要 @我 /找 地点：
# 那个地方躲着的人全部进 TA 的队伍；没人就白找一次。到每天清空的时候还没被找到，就算躲过了这一天，
# 档案里会记一笔。想出来：/躲 出来。
# 不想要躲猫猫：把 spots 写成 spots: []，或者把这一段删掉。
#   spots     能躲的地方，3 到 25 个，每个最多 8 个字，不带空格。地方越多越难找
#   searches  每位队长每天能找几次
#   times     每人每天能躲几次（被找到、被放走之后可以再躲）
hide:
  spots: [柜子里, 窗帘后, 床底下, 书架后, 阳台上, 桌子底下]
  searches: 3
  times: 3

# ---------------------------------------------------------------- 突发事件
# 队伍里的人在群里说话时（指令不算），有一定几率遇上下面的某一件事，我会接着那句话说出来。
# 写了 speaker: 队长 的事，是队长说话时落在 TA 的一名队员身上。
# 不想要突发事件：写成 events: []。
#   event_gap    同一个群里两件事之间至少隔几分钟
#   event_daily  每人每天最多遇上几件，0 = 不限
event_gap: 10
event_daily: 2

# 每件事要写：
#   name     名字，不能重复；档案里按它计数
#   chance   每次说话遇上它的几率，百分之几，可以写小数（0.5 就是两百句里一次）。
#            一句话最多遇上一件事，几件事的几率是加起来算的
#   say      这件事发生时我说的话，写成列表就每次随机挑一句。
#            可用：{members} 遇上的人  {captain} TA 的队长  {status} 变成的状态  {name} 我的名字
# 可以再写：
#   speaker  队长：改成队长说话时发生，落在 TA 随机一名合条件的队员身上。不写就是队员自己说话时
#   only     只有处于这些状态的队员会遇上，例如 only: [存活]
#   效果，下面写一种，都不写就只是说一句话：
#     effect: kick   掉出队伍，恢复自由
#     effect: roll   从 from 列出的状态里随机变成一个
#     set: 状态名     变成这个状态（已经是这个状态的人不会遇上）
events:
  - name: 溜走
    chance: 2
    effect: kick
    say: "🏃 趁 {captain} 不注意，{members} 悄悄溜出了队伍，现在自由啦！"

  - name: 点名
    speaker: 队长
    chance: 2
    say: "📣 {captain} 一开口，{members} 立刻站得笔直。"

  - name: 意外
    only: [存活]
    chance: 1
    set: 死亡
    say: "💥 {members} 被香蕉皮滑了一跤，阵亡了……"

  - name: 奇迹
    only: [死亡]
    chance: 5
    set: 存活
    say: "✨ 奇迹发生了，{members} 又站了起来！"

# ---------------------------------------------------------------- 档案
# @我 /档案 看自己在游戏里的记录，/档案 @某人 看别人的：被抓过几次、最常被谁抓、抓过多少人、
# 经历过哪些状态各几次、躲猫猫的战绩、遇上过几次突发事件。只有次数，没有时间，一直累计。
# 不用设置。被抓、抓人、躲过一整天这三项还会计入成就（prompts/achievements.yaml 的 caught、grabbed、slipped）。

# ---------------------------------------------------------------- 队长的操作
# 队长能用的操作。每个操作就是一条指令：@我 /名字 @某人（可以一次 @ 好几个人）。
#   name     指令名，也是操作的名字
#   aliases  别名，可省略，例如 aliases: [放人]
#   效果，下面三种写一种：
#     effect: grab   把还没进队的人抓进自己的队伍
#     effect: kick   把人移出队伍，之后别的队长可以再抓他
#     effect: roll   掷骰子：从 from 列出的状态里随机选一个给队员，例如 from: [存活, 死亡]
#     set: 状态名     把队员那一栏的状态改成它，例如 set: 死亡
#   only     可省略：只能对处于这些状态的队员用，例如 only: [存活]
#   by       可省略：谁能用。默认只有本队队长；by: [队长, 小队长] 表示本队的小队长也能用；
#            by: [] 表示只有管理员能用。管理员永远可以用（抓人除外）。
#   say      成功后我说的话，可省略（省略时用风格文件里的通用说法）。写成列表就每次随机挑一句。
#            可用：{actor} 操作的人  {members} 被操作的人  {count} 人数  {status} 改成或掷出的状态
#                  {captain} 所在队伍的队长  {action} 操作名  {name} 机器人在当前风格里的名字
actions:
  - name: 抓
    effect: grab
    say: "{actor} 抓到了 {members}！"

  - name: 踢出
    aliases: [放人]
    effect: kick
    say: "{members} 被 {actor} 请出了队伍，现在可以被别的队长抓走啦。"

  - name: 设为小队长
    set: 小队长
    only: [存活]
    say: "⭐ {actor} 任命 {members} 为小队长！"

  - name: 撤销小队长
    set: 队员
    say: "{members} 不再是小队长了。"

  - name: 死亡
    aliases: [阵亡]
    set: 死亡
    by: [队长, 小队长]
    say: "💀 {members} 阵亡了……"

  - name: 复活
    set: 存活
    say: "✨ {members} 复活了！"

# 想加新的？例如「受伤」：
#   1. 在 statuses 的 生死 那一栏加上它：生死: [存活, 受伤, 死亡]
#   2. 可选：在 icons 里加 受伤: 🩹
#   3. 在 actions 里加：
#        - name: 受伤
#          set: 受伤
#          only: [存活]
#          say: "🩹 {members} 受伤了！"
