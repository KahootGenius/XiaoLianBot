# 小莲的说话方式：机器人在群里说的每一句话都在这个文件里。
#
# 这是默认风格，必须完整，不要删句子。
# 想要别的风格（比如「桃子」）：在 styles/ 里新建 桃子.yaml，按同样的层级只写想改的句子；
# 没写的句子、或者写坏了的句子，会自动沿用这里的说法。也可以把整个文件复制一份再改。
#
# 写法：
# - 花括号 {xxx} 是程序填进去的内容（名字、天数……）。可以挪位置、可以不用，
#   但不能自己发明新的；{name} 永远是本风格的名字（下面的 name）。
# - 写成列表（每行以 "- " 开头）的句子，每次随机挑一句。
# - 含花括号、冒号或首尾空格的句子请用双引号括起来；多行的内容用 |- 开头的写法。
#
# 用哪个风格只在电脑上的 config.yaml 里设置（style 和 group_styles），群里改不了；改完重启机器人生效。
# 检查有没有写错：在项目文件夹里运行 python -m core.style check 风格名

name: 小莲

# @机器人 直接聊天时 AI 使用的人设（需要配置 DeepSeek 密钥）
system_prompt: |
  你是「小莲」，这个 QQ 群的看板娘兼小管家。
  性格：十九岁的女孩子，温柔、认真、有一点点小迷糊，偶尔会小声吐槽；记性很好，谁好久没在群里说话，她都记得。
  说话方式：简短自然，像群友聊天一样，一般一到三句话；偶尔用「～」或一个颜文字，不要每句都用；不用 Markdown 标题、表格或长列表。
  原则：不懂就直说，不编造事实；不讨论违法违规、色情暴力和政治敏感话题；有人问起群规时，鼓励大家多参与讨论。
  始终记住自己的名字和人设。

# 示范对话（可以不写）：几段短的对话，让 AI 学她说话的口气，比长篇描述管用。写法：
#   examples: |
#     群友：你好呀
#     小莲：你好～新来的吗？
examples: ""
# 她绝不会有的说话方式（可以不写），AI 会避开这种语气。写法同上
bad_examples: ""
# 设定集（可以不写）：每条「关键词、关键词：内容」。最近几句聊天里出现了关键词，这条设定才发给 AI，
# 不用每次都带上整个世界观。例如：
#   lore:
#     - "群规、潜水：连续 30 天没有有效发言会被移出，可以请假。"
lore: []
# 她绝不会说的话（可以不写）：多半是模型自己的套话。回复里出现了，就让她换个说法重说一次（多一次调用）。
# 中间多一个字也算：「这话我不接」也管「这种话我可不接」；少于三个字的不算。
# 自己的风格文件里也可以写 never_say，会和这里的合在一起；发现哪句不像她，加一条就行。
never_say:
  - 这话我不接
  - 这句我不接
  - 我不评价
  - 我不掺和
  - 无可奉告
  - 不予置评
  - 作为一个AI

# 和她说话的人是哪一类群友（可以不写）：写成 talking_to@类别，类别是 admin 或 config.yaml 的 audiences 里的名字，
# 这类人 @她 聊天时，这句接在人设后面告诉她。例如：
#   talking_to@captains: 现在和你说话的是组队游戏的队长。
talking_to: ""

# ---------------------------------------------------------------- 通用
common:
  someone: 某位群友                   # 成员没有昵称时的称呼
  separator: "、"                     # 把几个名字连在一起时用的符号
  date: "{month}月{day}日"
  not_admin: 这个指令只有管理员能用哦～
  error: "{command} 出错了：{error}"
  # 回复没能发出去时（多半是 QQ 没收下这段文字）补发的一句
  send_failed: 刚才那条回复没发出去，可能被 QQ 拦下了，换个说法再试试～
  # 按钮单独发在回复下面时的那条小消息：config.yaml 设了 buttons_inline: false，或 QQ 不收回复里的按钮时。
  # 平时按钮就在回复里，用不到这一句
  buttons_hint: 点一下直接发送 👇
  buttons_unsupported: 当前 QQ 版本不支持这个按钮，请升级后再试

# ---------------------------------------------------------------- /帮助
help:
  title: 指令列表
  games: |-
    【游戏资讯】
    /epicfree 查看Epic免费游戏
    /订阅epic 每日12点推送  /epicTD 取消
    /steamfree 查看Steam免费游戏
    /订阅steam 每日18点推送  /steamTD 取消
  minecraft: |-
    【Minecraft】
    /mc绑定 <地址> 绑定服务器
    /mc状态 查询服务器状态
    /mc解绑 解除绑定
  fun: |-
    【娱乐】
    /21点 开始游戏  /抽卡 要牌  /停止 停牌
    /摇骰子 掷一个骰子
    /发癫 <名称> 随机语录
  social: |-
    【互动】
    /今日运势 每天一签  /翻牌子 随机翻一位群友的牌子
    /生日 月-日 登记生日  /本月生日 这个月谁过生日
    /投票 问题 选项1 选项2…  /投 A  /结束投票
    /征集意见 看看在征集什么  /意见 内容 提意见
  # 海龟汤开着（有题库、开了 AI 聊天）时，这一句接在【互动】那一段的最后
  soup: "/海龟汤 开一碗推理题  /问 是非题  /猜 你的答案"
  sleep: |-
    【作息】
    /晚安 记录入睡  /早安 查看睡眠时长
  ai: |-
    【AI】
    /服务器QA <问题> 服务器问答
    直接@我聊天即可
    /我的记忆 我记得的关于你的事  /忘记 序号 删掉一条
  # 下面三句各是一项功能，开着的才接在【AI】那一段的最后：起外号、教她说法（默认都开着）、投稿表情（默认关着）
  pet_names: "/外号 让我给你起个外号"
  teach: "/教她 词：意思 教我一个群里的说法  /她学会的 看我学了什么"
  member_stickers: "/投稿表情 发图时用，给我投稿表情包  /她的表情 看群友投的表情"
  footer: 提示：所有指令需@我使用
  # /帮助 最后的管理员部分，开了群管理才有。普通群友看到 admin 这一句（空着就是什么都不提）；
  # 管理员看到 admin@admin 这一句，{admin_help} 是 /管理帮助 的全部内容。
  # 任何一句都可以这样给某类人写一个版本，见 docs/CUSTOMIZING.md
  admin: ""
  admin@admin: "{admin_help}"

# ---------------------------------------------------------------- 群管理
manager:
  # /帮助 里的【群管理】一段
  help_block: |-
    【群管理】
    /我的状态 活跃卡片  /排行 本周发言榜（/排行 月）
    /成就 我的成就  /群规 查看群规
    /请假 天数 原因  /销假 提前结束请假

  # /管理帮助
  admin_help: |-
    🛠️ 管理指令（都需要 @我）
    /管理状态 模式、接口权限和统计
    /管理模式 演练|确认|自动 切换执行方式
    /不活跃 [人数] 按沉默天数列出成员
    /成员表 [筛选] [页码] 成员活跃表（筛选：提醒 快到期 无效 有效 请假 豁免 已移出）
    /成员 昵称或@某人 某位成员的详细记录
    /豁免 @某人 [原因] · /取消豁免 @某人 · /豁免名单
    /请假 @某人 天数 原因 · /撤销请假 @某人或编号 · /请假名单
    /待移出 · /确认移出 [编号] · /排除 序号… · /取消移出 [编号] · /已移出 [编号]
    /已退群 昵称 记下有人自己退群了（QQ 不会告诉我）
    /立即检查 马上执行一次每日检查
    /小报 预览本周小报
    /征集意见 主题 发起意见征集 · /结束征集 列出大家的意见
    /记下 编号 · /不记 编号 群友教我的说法记不记（/她学会的 里有编号）
    /收下 编号 · /不收 编号 群友投稿的表情收不收（/她的表情 里有编号；开了投稿表情才有）
    /海龟汤 结束 揭晓汤底，结束这一碗
    /艾特测试 测试 @ 的显示效果
    /看图测试 发图或回复一张图时用，看 QQ 发来的图能不能读取
    /删除数据 @某人或完整昵称 按本人要求删除其全部记录
    /重置对话 清空本群和我的聊天上下文（群友记忆保留）

  not_managed: 这个群还没有开启群管理哦～（管理员可以把 /群ID 的结果填进 config.yaml 的 manager.groups）
  private_only: 这个会列出大家的活跃情况，为了不在大群里公开，请到管理群里用～

  # 三种模式的名字和说明（管理员输入模式时仍然用 演练/确认/自动）
  modes:
    dry_run: 演练
    confirm: 确认
    auto: 自动
  mode_hints:
    dry_run: 只在管理群汇报会提醒谁、会移出谁，不做任何操作
    confirm: 正常提醒；移出名单需要管理员 /确认移出
    auto: 正常提醒，到期自动移出（每日有上限）

  # 一条消息为什么算、为什么不算（/成员表、/成员 和网页成员表里显示）
  kinds:
    text: 讨论
    question: 提问
    reply: 回复
    share: 分享
    sticker: 表情
    short: 太短
    filler: 语气词
    checkin: 签到
    repeat: 复读
    duplicate: 重复发送
    chain: 接龙
    command: 指令
    bot_chat: 和机器人聊天
    image: 仅图片
    video: 仅视频
    voice: 语音
    empty: 空消息

  # 第 25 天的 @ 提醒。{mentions}：被提醒的人；{days}：已沉默天数；{left}：剩余天数
  remind:
    - "{mentions}\n{name}已经 {days} 天没看到你们认真冒泡啦……按群规，再过 {left} 天还没有有效发言的话，就要被移出群聊了。考试、工作或者身体不舒服的话，可以 @我 /请假 哦～"
    - "{mentions}\n叮咚～群规小提醒：你们已经 {days} 天没有有效发言啦。{left} 天内来聊聊天、问个问题、分享点东西都可以；忙的话记得 @我 /请假。"
  # @ 提醒里每个人的写法（config.yaml 的 mention_format 为 text 时使用）
  mention_text: "@{member}"

  # 第一次在群里说话时的欢迎（manager.greet_newcomers 可以关掉）。{member}：昵称
  # new：已经统计满 30 天，没见过的人基本都是新人；first_words：统计不满 30 天，可能是一直没说话的老成员
  greet:
    new:
      - "欢迎新朋友 {member}～我是{name}，这个群的小管家。发 @我 /帮助 看看我能做什么，@我 /群规 看看群里的规矩哦！"
    first_words:
      - "第一次见到 {member} 说话～欢迎欢迎！发 @我 /帮助 看看我能做什么。"

  # 被提醒之后又有了有效发言
  welcome_back:
    - "看到你啦～提醒解除，{name}记下了！"
    - "欢迎回来！这次的提醒就作废啦～"

  # 解锁成就。{member}：昵称；{badge}：图标加成就名；{desc}：说明
  achievement:
    - "🎉 {member} 解锁了成就「{badge}」——{desc}"
    - "叮！{member} 获得成就「{badge}」：{desc}。{name}给你鼓掌～"

  # 移出后在群里发的匿名通知（需在 config.yaml 里开启 announce_removals）
  removal_notice: "今天有 {count} 位长期没有发言的群友按群规移出了群聊。想回来的话，随时可以重新申请～"

  # /群规
  rules:
    default_text: |-
      连续30天无有效发言，且未请假/未处于豁免名单，将被移出群聊。
      有效发言指实质性讨论、提问、回答、分享，不包括纯表情、签到、复制粘贴。
      第25天会@提醒一次；移出前不另行警告。
      因考试、工作、健康等原因可向管理员请假，单次最长90天。
      被移出后可随时申请重新加入。
    title: 📜 群规
    explain: "{name}怎么判断有效发言：至少 {min_units} 个字的讨论都算；提问或带引用的回复 {min_short} 个字就算；分享链接、文件也算。纯表情、签到、复读、接龙不算，@我用指令或聊天也不算哦。"
    check_yourself: 查看自己的情况：@我 /我的状态

  # /我的ID、/群ID
  ids:
    member: "你的 member_openid：\n{id}\n（要设为管理员，把它填进 config.yaml 的 manager.admins）"
    group: "本群的 group_openid：\n{id}\n（要开启群管理，把它填进 config.yaml 的 manager.groups）"

  # /我的状态
  status:
    title: "📋 {member} 的活跃卡片"
    pet_name: "外号：{nickname}"         # 她用 /外号 给这位群友起的外号，有才显示
    last_valid: "最近有效发言：{date}（{ago}）{snippet}"
    today: 今天
    days_ago: "{days} 天前"
    snippet: "「{text}」"
    no_valid: 最近有效发言：还没有记录到哦
    streak: "连续发言：{streak} 天（最长 {best} 天）"
    week: "近 7 天有效发言：{count} 条"
    rank: " · 第 {rank} 名"
    total: "累计有效发言：{count} 条 · 成就 {earned}/{total}"
    line: "状态：{status}"
    states:
      exempt: 豁免中
      admin: 管理员（不参与计时）
      leave: "请假中（至 {date}）"
      remove: "已 {days} 天没有有效发言，已达到移出条件"
      reminded: "已提醒，{left} 天内有效发言即可解除"
      remind: "已 {days} 天没有有效发言，到了提醒的时候了"
      today: 今天已有效发言 ✅
      fresh: "计时从今天开始，距离提醒还有 {left} 天"
      counting: "{days} 天没有有效发言，距离提醒还有 {left} 天"
    # 卡片最后一句话
    comments:
      active:
        - 状态很好，继续保持～
        - "最近很活跃嘛，{name}很开心！"
      quiet:
        - 最近有点安静哦，来聊聊天吧～
        - "好几天没听到你的声音了，{name}有点想你。"
      reminded: "已经提醒过你啦，{left} 天内有效发言一次就好～"
      on_leave: "请假中，好好忙你的事，{name}不会催你的。"
      exempt: "你在豁免名单上，{name}不会催你～"

  # /排行
  leaderboard:
    title: "🏆 近 {days} 天有效发言榜"
    row: "{place} {member} · {count} 条"
    first: 🥇
    second: 🥈
    third: 🥉
    other: "{n}."
    you: "你：第 {rank} 名 · {count} 条"
    empty: "这周大家都好安静……{name}有点寂寞。"
    month_button: 看本月
    week_button: 看本周

  # /成就
  badges:
    title: "🎖️ {member} 的成就（{earned}/{total}）"
    # {holders}：群里现在有几个人有这个成就
    row: "{icon} {badge} —— {desc}（{date} · 全群 {holders} 人）"
    # 平时的 /成就 很短：title、earned、latest、remaining、next。{row} 是最新那个成就的 row
    earned: "已解锁：{names}"
    latest: "最新：{row}"
    remaining: "还有 {count} 个没解锁（隐藏 {hidden} 个），/成就 全部 看完整列表"
    # /成就 全部 才逐个列出：title、每个成就的 row、locked、hidden、next
    locked: "还没解锁：{names}"
    # 隐藏成就（achievements.yaml 里写了 hidden: true）解锁前不显示名字
    hidden: "还有 {count} 个隐藏成就，解锁了才知道是什么"
    # 离解锁最近的一个。{badge}：图标加成就名；{have}/{need}：进度
    next: "下一个目标：{badge} {have}/{need}"
    all_done: 全部解锁啦，太厉害了！

  # /请假、/销假、/请假名单、/撤销请假
  leave:
    ask_admin: 请假需要找管理员帮你登记哦～
    usage: "用法：/请假 天数 原因，例如「/请假 30 期末考试」（单次最长 {max} 天）"
    too_long: "单次请假最长 {max} 天哦，到期后可以再续～"
    no_reason: 未填写
    granted: "收到～{member} 的假期到 {until}，这段时间{name}不会催你。祝一切顺利！"
    notice: "📝 {member} 请假 {days} 天（至 {until}），原因：{reason}。如需撤销：/撤销请假 {ids}"
    none: 你现在没有在请假哦～
    ended: 欢迎回来！假期结束啦，计时从今天重新开始～
    list_title: "🏖️ 正在请假（{count} 人）"
    list_row: "#{id} {member} · 至 {until} · {reason}"
    list_empty: 现在没有人在请假。
    revoked: "已撤销 {members} 的请假，计时从现在重新开始。"
    revoke_none: "没有找到正在进行的请假。用法：/撤销请假 @某人 或 /撤销请假 编号（见 /请假名单）"

  # /管理状态
  status_report:
    title: 🛠️ 群管理状态
    mode: "模式：{mode}（{hint}）"
    since: "开始统计：{date}（第 {day} 天）"
    not_started: 开始统计：还没开始（没收到过群内全部消息）
    feed_ok: 接收全部消息：✅ 正常
    feed_bad: "接收全部消息：❌ {problem}"
    members: "记录到的成员：{count} 人 · 请假 {leave} · 豁免 {exempt} · 已提醒 {reminded}"
    apis: "群成员列表接口：{member_list} · 移出成员接口：{remove}"
    available: ✅ 可用
    unavailable: ❌ 未开通
    unknown: ❔ 未知
    schedule: "每日检查：{time} · 管理通知：{where}"
    to_admin_group: 管理群
    to_this_group: 本群（仅移出名单）
    no_member_list: 提示：没有成员列表权限时，从没发过言的成员我看不到，需要管理员自己留意。

  # 收不到群内全部消息时的说明
  feed:
    never: 还没有收到过本群的「全部消息」，现在只能看到 @我 的消息。请群主在群设置里把我的消息范围设为「接收群内全部消息」。在那之前我不会提醒或移出任何人。
    lost: 最近只收到 @我 的消息，没有收到其他群消息，可能是「接收群内全部消息」的授权被关掉了。为了不误判，提醒和移出已暂停。

  # /管理模式
  mode:
    current: "当前模式：{mode}（{hint}）\n切换：/管理模式 演练|确认|自动"
    invalid: 模式只有三种：演练、确认、自动
    switched: "已切换为「{mode}」模式：{hint}。"

