    rolled: "🎲 {actor} 为 {members} 掷出了「{status}」！"    # effect: roll 的操作没写 say 时用这句
    fail:
      self: 不能抓自己哦～
      captain: "{member} 今天是队长，不能这样做哦。"
      taken: "{member} 已经在 {captain} 的队伍里了。"
      mine: "{member} 已经在你的队伍里啦。"
