# /讲笑话 讲的笑话。增删、修改都只要改这个文件，不用动代码；改完重启机器人生效。
# 写错的笑话会被跳过，启动时在日志里指出是第几个。检查这个文件：python -m modules.fun.jokes
#
# 每个笑话写成下面两种里的一种：
#   q 和 a   一问一答：我先说问题，有人发 /为什么（或者点按钮）才说答案
#   text     一句话讲完的笑话
# 可以再写：
#   day      只在某个特别的日子讲（prompts/occasions.yaml 里的名字，例如 day: 春节），那天它排在最前面
# 每个群都会把所有笑话听过一遍之后才重复。每句最多 200 个字。
jokes:
  - q: 为什么数学书总是不开心？
    a: 因为它的问题太多了。

  - q: 为什么企鹅的肚子是白的？
    a: 因为它手短，洗澡只洗得到肚子。

  - q: 为什么飞机飞得那么高，却从来撞不到星星？
    a: 因为星星会「闪」。

  - q: 什么门永远关不上？
    a: 球门。

  - q: 为什么蚕宝宝很有钱？
    a: 因为它会结茧（节俭）。

  - q: 为什么程序员总把万圣节和圣诞节弄混？
    a: 因为 Oct 31 等于 Dec 25（八进制的 31 就是十进制的 25）。

  - q: 小明为什么把闹钟扔出了窗外？
    a: 因为他想看看时间是怎么飞逝的。

  - q: 为什么月亮从来不迟到？
    a: 因为它一直上夜班，没人敢催。

  - q: 哪种水果最不爱回消息？
    a: 芒果，因为它总是很「芒」。

  - q: 为什么潜水的群友最适合当侦探？
    a: 因为他什么都看见了，就是一句话不说。

  - text: 我本来想讲一个关于时间的笑话，可惜没时间了。

  - text: 昨天有人问我会不会讲冷笑话。我说会，然后群里就安静到了现在。

  - q: 为什么过年的时候饺子最紧张？
    a: 因为一家人都盯着它，还要下锅。
    day: 春节

  - text: 郑重通知：从今天起，本群每条消息收费一毛。——愚人节快乐。
    day: 愚人节
