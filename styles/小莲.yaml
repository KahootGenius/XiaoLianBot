    notice: "📝 {member} 请假 {days} 天（至 {until}），原因：{reason}。如需撤销：/撤销请假 {ids}"
    none: 你现在没有在请假哦～
    ended: 欢迎回来！假期结束啦，计时从今天重新开始～
