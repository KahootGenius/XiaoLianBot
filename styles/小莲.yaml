    # {teams}、{disband}、{clear}：查看、解散、清空队伍的指令（可在 prompts/teams.yaml 的 commands 里改名）
    help: |-
      【组队游戏】每天 {reset} 清空队伍
      {teams} 查看今天的队伍
      队长：{grab} @某人 抓人进队 · {disband}
      队长对自己的队员：{actions}（都要 @ 对象）
      管理员（裁判）：对任何队员都能用以上操作 · {disband} @队长 · {clear}
    # 接在上面那一段后面的几句。teams.yaml 里写了躲的地方才有 help_hide，写了突发事件才有 help_events。
    # {hide}、{seek}、{record}：躲起来、队长找人、看档案的指令（也可以在 teams.yaml 的 commands 里改名）
