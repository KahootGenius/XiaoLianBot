      remove: "已 {days} 天没有有效发言，已达到移出条件"
      reminded: "已提醒，{left} 天内有效发言即可解除"
      remind: "已 {days} 天没有有效发言，到了提醒的时候了"
      today: 今天已有效发言 ✅
      fresh: "计时从今天开始，距离提醒还有 {left} 天"
      counting: "{days} 天没有有效发言，距离提醒还有 {left} 天"
    # 卡片最后一句话
    comments:
      active:
        - 状态很好，继续保持～
