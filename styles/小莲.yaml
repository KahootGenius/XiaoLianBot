  admin: 管理员指令：/管理帮助

# ---------------------------------------------------------------- 群管理
manager:
  # /帮助 里的【群管理】一段
  help_block: |-
    【群管理】
    /我的状态 活跃卡片  /排行 本周发言榜（/排行 月）
    /成就 我的成就  /群规 查看群规
    /请假 天数 原因  /销假 提前结束请假

  # /管理帮助
  admin_help: |-
    🛠️ 管理指令（都需要 @我）
    /管理状态 模式、接口权限和统计
    /管理模式 演练|确认|自动 切换执行方式
    /不活跃 [人数] 按沉默天数列出成员
    /成员表 [筛选] [页码] 成员活跃表（筛选：提醒 快到期 无效 有效 请假 豁免 已移出）
    /成员 昵称或@某人 某位成员的详细记录
    /豁免 @某人 [原因] · /取消豁免 @某人 · /豁免名单
    /请假 @某人 天数 原因 · /撤销请假 @某人或编号 · /请假名单
    /待移出 · /确认移出 [编号] · /排除 序号… · /取消移出 [编号] · /已移出 [编号]
    /立即检查 马上执行一次每日检查
    /小报 预览本周小报
    /艾特测试 测试 @ 的显示效果
    /删除数据 @某人 按本人要求删除其全部记录
    /重置对话 清空本群和我的聊天上下文（群友记忆保留）

  not_managed: 这个群还没有开启群管理哦～（管理员可以把 /群ID 的结果填进 config.yaml 的 manager.groups）
  private_only: 这个会列出大家的活跃情况，为了不在大群里公开，请到管理群里用～

  # 三种模式的名字和说明（管理员输入模式时仍然用 演练/确认/自动）
  modes:
    dry_run: 演练
    confirm: 确认
    auto: 自动
  mode_hints:
    dry_run: 只在管理群汇报会提醒谁、会移出谁，不做任何操作
    confirm: 正常提醒；移出名单需要管理员 /确认移出
    auto: 正常提醒，到期自动移出（每日有上限）

  # 一条消息为什么算、为什么不算（/成员表、/成员 和网页成员表里显示）
  kinds:
    text: 讨论
    question: 提问
    reply: 回复
    share: 分享
    sticker: 表情
    short: 太短
    filler: 语气词
    checkin: 签到
    repeat: 复读
    duplicate: 重复发送
    chain: 接龙
    command: 指令
    bot_chat: 和机器人聊天
    image: 仅图片
    video: 仅视频
    voice: 语音
    empty: 空消息

  # 第 25 天的 @ 提醒。{mentions}：被提醒的人；{days}：已沉默天数；{left}：剩余天数
  remind:
    - "{mentions}\n{name}已经 {days} 天没看到你们认真冒泡啦……按群规，再过 {left} 天还没有有效发言的话，就要被移出群聊了。考试、工作或者身体不舒服的话，可以 @我 /请假 哦～"
    - "{mentions}\n叮咚～群规小提醒：你们已经 {days} 天没有有效发言啦。{left} 天内来聊聊天、问个问题、分享点东西都可以；忙的话记得 @我 /请假。"
  # @ 提醒里每个人的写法（config.yaml 的 mention_format 为 text 时使用）
  mention_text: "@{member}"

  # 第一次在群里说话时的欢迎（manager.greet_newcomers 可以关掉）。{member}：昵称
  # new：已经统计满 30 天，没见过的人基本都是新人；first_words：统计不满 30 天，可能是一直没说话的老成员
  greet:
    new:
      - "欢迎新朋友 {member}～我是{name}，这个群的小管家。发 @我 /帮助 看看我能做什么，@我 /群规 看看群里的规矩哦！"
    first_words:
      - "第一次见到 {member} 说话～欢迎欢迎！发 @我 /帮助 看看我能做什么。"

  # 被提醒之后又有了有效发言
  welcome_back:
    - "看到你啦～提醒解除，{name}记下了！"
    - "欢迎回来！这次的提醒就作废啦～"

  # 解锁成就。{member}：昵称；{badge}：图标加成就名；{desc}：说明
  achievement:
    - "🎉 {member} 解锁了成就「{badge}」——{desc}"
    - "叮！{member} 获得成就「{badge}」：{desc}。{name}给你鼓掌～"

  # 移出后在群里发的匿名通知（需在 config.yaml 里开启 announce_removals）
  removal_notice: "今天有 {count} 位长期没有发言的群友按群规移出了群聊。想回来的话，随时可以重新申请～"

  # /群规
  rules:
    default_text: |-
      连续30天无有效发言，且未请假/未处于豁免名单，将被移出群聊。
      有效发言指实质性讨论、提问、回答、分享，不包括纯表情、签到、复制粘贴。
      第25天会@提醒一次；移出前不另行警告。
      因考试、工作、健康等原因可向管理员请假，单次最长90天。
      被移出后可随时申请重新加入。
    title: 📜 群规
    explain: "{name}怎么判断有效发言：至少 {min_units} 个字的讨论都算；提问或带引用的回复 {min_short} 个字就算；分享链接、文件也算。纯表情、签到、复读、接龙不算，@我用指令或聊天也不算哦。"
    check_yourself: 查看自己的情况：@我 /我的状态

  # /我的ID、/群ID
  ids:
    member: "你的 member_openid：\n{id}\n（要设为管理员，把它填进 config.yaml 的 manager.admins）"
    group: "本群的 group_openid：\n{id}\n（要开启群管理，把它填进 config.yaml 的 manager.groups）"

  # /我的状态
