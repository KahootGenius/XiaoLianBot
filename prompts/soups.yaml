# 海龟汤（/海龟汤）的题库。增删、修改题目只要改这个文件，不用动代码；改完重启机器人生效。
# 写得不对的题目会被跳过，机器人启动时会在日志里说是第几题、哪里不对。
# 想用自己的题库：在 local/prompts/ 里放一个同名文件，机器人就只用那一份（不会和这里的合并）。
#
# 玩法：@我 /海龟汤 随机开一碗，她念出汤面；群友用 /问 问是非题，她只回答「是」「不是」「无关」；
# 觉得知道真相了用 /猜。这个群玩过的题目不会马上重复，全部玩过一遍才从头再来。
#
# 每道题要写：
#   code     唯一编号，只用英文、数字、下划线。用来记这个群玩过哪些，改了它这道题就算新题
#   title    名字，开锅时念出来，不要剧透
#   surface  汤面：群友看到的情境，结尾最好问一句「为什么？」
#   truth    汤底：真相。猜中或结束时念出来
#   points   关键点：猜中这几点才算答对，每条一句话。写得太多就很难猜中，一到三条正好
#   hints    提示，可省略：/海龟汤 提示 时按顺序一条一条给
#
# 出题的讲究：
# - 汤底要能让是非题一步步问出来，只有一个说得通的解释，不能靠冷知识；
# - 群里有未成年人，请只写「清汤」：不要血腥、恐怖和成人内容。
# - 判断「是 / 不是」和猜没猜中的是 AI，汤底和关键点写得越明白，它判得越准。

- code: bald_rain
  title: 淋不湿的头发
  surface: 外面下着大雨，阿强没打伞，没戴帽子，也没有躲雨，在街上走了十分钟。回到家，他的衣服全湿了，头发却一根也没湿。为什么？
  truth: 阿强是光头，一根头发也没有，所以没有头发可以湿。
  points:
    - 阿强没有头发（是光头）
  hints:
    - 和雨的大小、他走得快慢都没关系。
    - 想想「头发」本身。

- code: leap_day
  title: 第五个生日
  surface: 小禾今年刚过完她的第 5 个生日，可她已经是大学生了。她没有记错，家里人也没有骗她。为什么？
  truth: 小禾出生在 2 月 29 日，这个日子四年才有一次，所以二十岁的她只过了五个真正的生日。
  points:
    - 她的生日是 2 月 29 日（闰年才有的那一天）
  hints:
    - 她的年龄和别的大学生一样。
    - 问题出在日历上。

- code: library_fine
  title: 不带走的书
  surface: 一位女士走到柜台前，放下一本书，说了声「不好意思」，付了钱就走了，书没有带走。柜台里的人一点也不觉得奇怪。为什么？
  truth: 这里是图书馆。这本书不是她的，是她从这里借走的；书过期了，她是来还书的，付的钱是逾期的罚款。
  points:
    - 这里是图书馆，她是来还书的
    - 她付的钱是因为书过期了（罚款）
  hints:
    - 这里不是书店。
    - 这本书本来就不是她的。

- code: blank_paper
  title: 满分的白卷
  surface: 考试时全班都在埋头答题，只有小安十分钟就交了卷，卷子上除了名字什么都没写。结果只有她得了满分。为什么？
  truth: 试卷开头写着「请先读完所有题目再作答」，最后一题写着「以上各题都不用做，写上名字就可以交卷」。只有小安照着要求先把题目读完了。
  points:
    - 卷子上写着不用答题，写上名字就可以交卷
    - 只有小安先把题目全部读完了，所以只有她看到了
  hints:
    - 小安没有作弊，老师也没有偏心。
    - 答案就写在卷子上。

- code: braille
  title: 停电的夜晚
  surface: 晚上，整栋楼突然停电，屋里伸手不见五指。阿梅没有点蜡烛，也没有开手电，却把手上的那本书一页一页接着读完了。为什么？
  truth: 阿梅是盲人，她读的是盲文书，用手指摸着读，有没有光都一样。
  points:
    - 阿梅看不见（是盲人）
    - 她读的是盲文，是用手摸着读的
  hints:
    - 她没有用任何会发光的东西。
    - 她读书的方式和大多数人不一样。

- code: last_stop
  title: 终点站
  surface: 末班公交车开到了终点站，乘客都下了车，车上还剩一个人。他没有买票，也不打算下车，却没有任何人觉得不对。为什么？
  truth: 剩下的那个人就是这辆车的司机。
  points:
    - 剩下的那个人是这辆车的司机
  hints:
    - 他不是乘客。

- code: note_laundry
  title: 冰箱上的纸条
  surface: 妈妈出门前在冰箱上贴了一张纸条。小宇放学回家看了一眼，立刻跑去阳台把晾着的衣服全收了进来。可纸条上一个字也没提到衣服。为什么？
  truth: 纸条上写的是「晚上有雨，出门记得带伞」。小宇看到要下雨，想起衣服还晾在外面，就先去收了。
  points:
    - 纸条上说的是要下雨了
    - 衣服晾在外面会被雨淋湿，所以他去收
  hints:
    - 纸条是在提醒小宇另一件事。
    - 和天气有关。

- code: relay
  title: 冲线之后
  surface: 运动会上，小凯第一个冲过终点线，全场都在欢呼，裁判却宣布他们班的成绩无效。小凯没有抢跑，也没有跑错跑道。为什么？
  truth: 这是接力赛，小凯跑最后一棒。交接的时候接力棒掉了，他没有捡就跑了出去，冲线时手里没有接力棒。
  points:
    - 这是接力赛
    - 他冲线的时候手里没有接力棒
  hints:
    - 这不是一个人的比赛。
    - 他少带了一样东西。

- code: old_photo
  title: 老照片
  surface: 小雨翻到一张老照片，照片里爸爸还是个小男孩，身边站着一个她从没见过的小女孩。爸爸笑着说：「这个人你每天都能见到。」为什么？
  truth: 照片里的小女孩是小雨的妈妈。爸爸妈妈从小就认识，那是妈妈小时候的样子。
  points:
    - 照片里的小女孩是小雨的妈妈（小时候）
  hints:
    - 那个小女孩现在已经长大了。
    - 她和小雨住在一起。

- code: doorbell_cat
  title: 四点的门铃
  surface: 每天下午四点，老李家的门铃都会响一声，开门一看，门外一个人也没有。老李一点也不生气，反而每天都等着这一声。为什么？
  truth: 按门铃的是老李养的猫。它每天下午在外面玩够了，就跳起来按门铃让老李开门，门一开它就贴着门缝溜进屋，所以门外看不到人。
  points:
    - 按门铃的不是人，是老李养的猫（宠物）
    - 它按门铃是为了让老李开门放它进屋
  hints:
    - 没有人在恶作剧。
    - 按门铃的那位个子很矮。

- code: three_fish
  title: 三条鱼
  surface: 两位爸爸和两个儿子一起去钓鱼，每人都钓到了一条，回家一数，一共只有三条鱼。没有人把鱼弄丢，也没有人说谎。为什么？
  truth: 去钓鱼的一共只有三个人：爷爷、爸爸和儿子。爸爸既是爷爷的儿子，又是孩子的爸爸。
  points:
    - 去钓鱼的一共只有三个人
    - 他们是祖孙三代：爷爷、爸爸和儿子
  hints:
    - 数一数到底去了几个人。
    - 有人既是「爸爸」又是「儿子」。

- code: buns_dog
  title: 不吃的包子
  surface: 老王每天早上都去同一家包子铺买两个肉包，付了钱，自己一口不吃，转身放在店门口的台阶上就走了。第二天照样来买。为什么？
  truth: 包子是买给一只流浪狗的。那只狗每天早上都在店门口等他，老王把包子放在台阶上喂它。
  points:
    - 包子是买给一只流浪狗（动物）吃的
  hints:
    - 包子没有浪费。
    - 有谁每天早上在店门口等着他。

- code: elevator
  title: 只坐到十二楼
  surface: 小学生豆豆住在二十楼。每天早上他坐电梯直接到一楼去上学；放学回来，他却只坐到十二楼，再走楼梯回家。可要是电梯里有别的大人，或者那天他带着长柄雨伞，他就会一直坐到二十楼。为什么？
  truth: 豆豆个子还小，电梯里二十楼的按钮太高，他最高只够得着十二楼的。有大人在可以请人帮忙按，带着长柄伞可以用伞尖去按。
  points:
    - 豆豆个子矮，够不着二十楼的按钮
    - 有大人帮忙，或者用雨伞去戳，才按得到
  hints:
    - 电梯没有坏。
    - 看看电梯里的按钮是怎么排的。
