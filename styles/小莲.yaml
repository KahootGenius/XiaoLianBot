    row: "{place} {member} · {count} 条"
    first: 🥇
    second: 🥈
    third: 🥉
    other: "{n}."
    you: "你：第 {rank} 名 · {count} 条"
    empty: "这周大家都好安静……{name}有点寂寞。"
    month_button: 看本月
    week_button: 看本周

  # /成就
