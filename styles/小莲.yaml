    help_record: "{record} 看自己的游戏档案 · {record} @某人 看别人的"
    title: "🏳️ 今日队伍 · {date}"
    team: "【{captain}】{count} 人：{members}"
    tagged: "{member}（{statuses}）"        # 没有图标的状态
    legend: "图例：{legend}"
    hiding: "🙈 躲起来的（{count} 人）：{members}"      # 只说谁躲着，不说躲在哪儿
    none: "今天还没有队伍哦～队长 @我 {grab} @某人 就能开始组队。"
    unnamed: "群友#{tag}"                   # 不知道昵称时的称呼
    not_here: 这个群没有开启组队游戏哦～
    usage: "要 @ 对象哦，例如：@我 /{action} @某人"
