# 特别的日子：到了这些日子，机器人会有一点不一样，而且不会告诉大家为什么（彩蛋）。
# 增删、修改都只要改这个文件，不用动代码；改完重启机器人生效。
# 写错的日子会被跳过，启动时在日志里指出是哪一个；别的日子照常。
# 看每个日子下一次是哪天：python -m core.occasions
#
# 彩蛋有两种。
#
# 一、风格文件里任何一句话，都可以给某个日子另写一版：在原句旁边写「键名@日子的名字」，
#     和给某类群友另写一版（键名@admin）是同一种写法。那一天说的就是这一版，例如：
#       social:
#         fortune:
#           levels@元旦: [大吉]          # 元旦这天，每个人的今日运势都是大吉
#           title@元旦: "🎆 {member} 的新年第一签 · {date}"
#     列表（levels、good、bad、comments 这些）和单句都可以。同一天有两个日子时，写在前面的优先；
#     日子的版本比群友类别的版本优先。
#
# 二、下面每个日子自己能写的：
#   name    名字，不能重复，不带空格、. 和 @。风格文件里的 @ 后面写的就是它
#   when    是哪一天，可以写一个或一个列表：
#             01-01            每年这一天
#             2027-02-06       只有那一天
#             农历 正月初一      农历的日子：正月…腊月、初一…三十，也可以写成 农历 1-1。闰月不算
#             农历 除夕          正月初一的前一天（腊月二十九或三十）
#           农历日期表到 2041 年为止（core/lunar.py），用的是香港天文台公布的对照表
#   lasts   连续几天，可省略，默认 1。例如春节写 3 就是初一到初三
#   chat    AI 聊天时告诉她的话，可省略。她总会知道今天是这个日子，这里再补一句怎么过
#   greet   这天每个群里最先说话的几个人，各得到我的一句话（一人一次），可省略。
#           写成列表就每次随机挑一句。可用：{member} 那位群友  {n} TA 是第几个  {day} 日子的名字  {name} 我的名字
#   first   greet 说给前几个人，可省略，默认 10；写 0 就是这天每个说话的人都有
#   die     组队游戏里掷骰子抢人时，点数加几（最多加到 6），可省略。写 1 就是这天手气好一点
days:
  - name: 元旦
    when: 01-01
    chat: 新的一年开始了，可以祝大家新年快乐。
    greet: "🎆 新年快乐！{member} 是今年第 {n} 个在群里冒泡的～"
    first: 5
    die: 1

  - name: 除夕
    when: 农历 除夕
    chat: 今晚守岁，明天就是春节。

  - name: 春节
    when: 农历 正月初一
    lasts: 3
    chat: 正在过年，可以拜年、说吉利话。
    greet: "🧧 新春快乐！{member} 是今天第 {n} 个来拜年的，恭喜发财～"
    first: 8
    die: 1

  - name: 元宵
    when: 农历 正月十五
    chat: 今天吃汤圆、看花灯。

  - name: 愚人节
    when: 04-01
    chat: 今天可以开些无伤大雅的小玩笑，但别骗人做会后悔的事。

  - name: 端午
    when: 农历 五月初五
    chat: 今天吃粽子、赛龙舟。

  - name: 七夕
    when: 农历 七月初七

  - name: 中秋
    when: 农历 八月十五
    chat: 今晚赏月、吃月饼。
    greet: "🥮 中秋快乐！{member}，今晚的月亮分你一半～"
    first: 5

  - name: 万圣夜
    when: 10-31

  - name: 圣诞
    when: [12-24, 12-25]
    chat: 圣诞节，可以说圣诞快乐。

  - name: 跨年夜
    when: 12-31
    chat: 今年的最后一天，今晚跨年。
