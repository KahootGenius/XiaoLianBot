    ended_title: "📮 意见征集结束：{topic}（{people} 人，共 {count} 条）"
    row: "{n}. {member}：{text}"
    ended_empty: "📮 意见征集结束：{topic}\n这次没有人提意见……"
    summary: "💬 {name}看完大家的意见：\n{summary}"
    button: 我要提意见

  # /翻牌子：开玩笑的抽签，从本周活跃的群友里按发言多少加权抽一位，每人每天一次（管理员不限次数）
  # /海龟汤：她主持的情境推理。题目在 prompts/soups.yaml；群友 /问 是非题、/猜 汤底，是与不是由 AI 对照汤底来判断，
  # 群里看到的是下面这些话
  soup:
    disabled: 海龟汤没有开启哦。
    no_ai: 海龟汤要开了 AI 聊天才能玩哦。
    started: |-
      🍲 海龟汤开锅：{title}（{starter} 点的）
      {surface}
      问是非题：@我 /问 你的问题，我只回答「是」「不是」「无关」。
      觉得知道真相了：@我 /猜 你的答案
    status: |-
      🍲 正在喝的海龟汤：{title}
      {surface}
      已经问了 {asked} 个问题，给过 {hints} 条提示。
    clues: 最近问出来的：
    clue: "· {question} → {answer}"
    short:                            # 上面每条线索后面的简短回答
      positive: 是
      negative: 不是
      partly: 是也不是
    none: "现在没有在喝的海龟汤。开一碗：@我 /海龟汤"
    expired: "上一碗「{title}」放了一天没人喝完，凉了。汤底是：{truth}"
    ask_usage: "问一个能用「是」或「不是」回答的问题，例如：/问 他认识那个人吗"
    guess_usage: "把你猜的真相说出来，例如：/猜 因为他其实是……"
    too_long: "太长啦，{max} 个字以内说完吧。"
    enough: "这一碗已经问了 {max} 个问题啦，直接 /猜 吧。实在猜不出，点汤的人或管理员可以 /海龟汤 结束"
    too_fast: "问得太快啦，让{name}喘口气，过一会儿再来～"
    failed: "{name}一时没想明白，过会儿再说一次～"
    invalid: 这个我答不了。问一个能用「是」或「不是」回答的问题吧，想直接说答案就用 /猜
    asked: "🥄 {member} 问：{question}\n{answer}"
    answers:                          # 她对一个是非题的回答，每次随机挑一句
      positive: [是。, 是的。, 对。]
      negative: [不是。, 不对。]
      unrelated: [无关。, 这个和真相没有关系。]
      partly: [是也不是。, 只说对了一部分。]
    key: （问到点子上了！）            # 问中了关键点时，接在回答后面
    wrong: "🥄 {member} 猜：{guess}\n不对哦，再想想。"
    close: "🥄 {member} 猜：{guess}\n接近了！不过还没说全。"
    solved: |-
      🎉 {member} 喝到汤底了！
      汤底：{truth}
      这一碗一共问了 {asked} 个问题。
    hint: "💡 提示 {n}/{total}：{hint}"
    hint_later: "先多问几个问题吧，再问 {more} 个就给提示。"
    no_more_hints: 提示已经给完啦，剩下的靠你们了。
    no_hints: 这一碗没有提示，靠你们自己了。
    ended: "🍲 「{title}」不喝了。汤底是：{truth}"
    not_yours: 只有点这碗汤的人或管理员能结束哦。
    ask_button: 我要提问
    guess_button: 我来猜
    hint_button: 要个提示
    again_button: 再来一碗

  flip:
    result:
      - "📜 {member} 翻开了牌子……今晚是 {target}！"
      - "📜 {member} 掀开牌子一看：{target}，就决定是你了！"
    again: "今天已经翻过牌子啦，翻到的是 {target}。明天再来～"
    need_mentions: "这个群没开群管理，我不知道谁最近活跃；@ 几个人，我从里面帮你翻"
    empty: 这周还没有别人有效发言过，牌子都是空的……
    button: 我也要翻

