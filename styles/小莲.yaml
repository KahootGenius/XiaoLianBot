# ---------------------------------------------------------------- 互动
social:
  # /今日运势：每人每天固定一签。下面这些列表是抽签用的「签筒」，可以随意增删、改成本风格的说法
  fortune:
    title: "🔮 {member} 的今日运势 · {date}"
    level: "运势：{level}"
    good_line: "宜：{items}"
    bad_line: "忌：{items}"
    button: 我也要测                  # 按钮上的字是群友会说的话，读起来像邀请
    levels: [大吉, 中吉, 小吉, 吉, 末吉, 凶]
    good: [冒泡聊天, 早睡早起, 组队开黑, 喝一杯奶茶, 认真回答问题, 分享一首歌, 出门晒太阳, 整理房间]
    bad: [熬夜, 潜水, 立 flag, 冲动消费, 和人抬杠, 拖延, 空腹喝咖啡, 刷手机到凌晨]
    # 每条可以用 {member}（昵称）、{level}（今天的运势）
    comments:
      - "{name}偷偷看了一眼：{member} 今天是{level}，记得来群里报个到～"
      - "运势只是参考，开心最重要！"
      - "今天适合多和大家聊聊天哦。"
      - "{level}也好，凶也好，有{name}陪着呢。"

  # /生日、/本月生日，以及生日当天的祝福（成员当天第一次说话时）
  birthday:
    saved: "记住啦！你的生日是 {date}，到时候{name}第一个祝你生日快乐～"
    mine: "你登记的生日是 {date}。改：/生日 月-日 · 删除：/生日 删除"
