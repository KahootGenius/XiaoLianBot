    # 躲猫猫：还没进队的人躲起来，藏在哪儿由她定，谁也不告诉
    hide:
      disabled: 这个游戏没有设置躲猫猫的地方哦。
      done: "🙈 {member} 躲起来了！藏在哪儿只有{name}知道（一共 {count} 个地方）。队长要用 {seek} 地点 才找得到。"
