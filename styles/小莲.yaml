    mode: "模式：{mode}（{hint}）"
    since: "开始统计：{date}（第 {day} 天）"
    not_started: 开始统计：还没开始（没收到过群内全部消息）
    feed_ok: 接收全部消息：✅ 正常
    feed_bad: "接收全部消息：❌ {problem}"
    members: "记录到的成员：{count} 人 · 请假 {leave} · 豁免 {exempt} · 已提醒 {reminded}"
    apis: "群成员列表接口：{member_list} · 移出成员接口：{remove}"
    available: ✅ 可用
    unavailable: ❌ 未开通
    unknown: ❔ 未知
    schedule: "每日检查：{time} · 管理通知：{where}"
    to_admin_group: 管理群
    to_this_group: 本群（仅移出名单）
